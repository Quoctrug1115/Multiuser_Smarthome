[package]
name = "smarthome-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Framework & Async Runtime
axum = { version = "0.8", features = ["ws", "macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["compat"] }
tower-http = { version = "0.6", features = ["cors"] }
futures-util = "0.3"

# Microsoft SQL Server Driver & Connection Pool
tiberius = { version = "0.12", default-features = false, features = ["tokio", "rustls", "chrono", "uuid", "tds73"] }
bb8 = "0.8"
bb8-tiberius = "0.15"

# MQTT Client (EMQX / ESP32 Wokwi)
rumqttc = "0.24"

# Serialization & Data Types
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Authentication & Security
jsonwebtoken = "9"
bcrypt = "0.15"

# Logging & Environment
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"